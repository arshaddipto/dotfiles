[config]
version_check = false
caching = false

# Changing the syntax
# Expr is for keywords like {{ <keyword> }}
expr_prefix = "{{"
expr_postfix = "}}"

# Block is for stuff like for loops etc.
block_prefix = "<*"
block_postfix = "*>"

[config.wallpaper]
command = "hyprctl hyprpaper wallpaper ,{{ image }}"

# Style waybar calendar using matugen
[templates.waybar_clock]
input_path = './templates/waybar-clock.jsonc'
output_path = '~/.config/waybar/ModuleClock.jsonc'

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.hyprland]
input_path = './templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'

[templates.hyprland_lua]
input_path = './templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.vesktop]
input_path = './templates/midnight-discord.css'
output_path = '~/.config/vesktop/themes/midnight-discord.css'
