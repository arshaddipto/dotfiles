# All configs in this file are hardware-specific
# They may need changes or have to be removed depending on the hardware

# See https://wiki.hypr.land/Configuring/Monitors/
monitor = eDP-1, 1920x1080@144, 0x0, 1

# To use integrated graphics instead of dedicated GPU to save battery life
# See https://wiki.hypr.land/Configuring/Multi-GPU/
env = AQ_DRM_DEVICES, /dev/dri/amd-igpu

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
workspace = 1, monitor:eDP-1 ,persistent:true
workspace = 2, monitor:eDP-1 ,persistent:true
workspace = 3, monitor:eDP-1 ,persistent:true
workspace = 4, monitor:eDP-1 ,persistent:true
workspace = 5, monitor:eDP-1 ,persistent:true

# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = logitech-wireless-mouse-1
    sensitivity = -0.6
}
